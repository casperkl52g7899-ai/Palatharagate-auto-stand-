<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palathara Gate Auto Taxi Stand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:italic,wght@0,700;1,400;1,700&display=swap');
        
        body { background-color: #ffde59; font-family: 'Poppins', sans-serif; color: #000; }
        .app-container { max-width: 420px; margin: 0 auto; min-height: 100vh; padding-bottom: 110px; }
        
        /* ഹെഡർ ബോക്സ് */
        .title-box {
            background-color: #ffde59;
            border: 5px solid #000;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 8px 8px 0 #000;
            margin: 20px;
        }

        /* കളർഫുൾ ക്യാപ്ഷൻ */
        .trusted-partner {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            background: linear-gradient(to right, #000, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 2px solid #000;
            display: inline-block;
            padding-bottom: 2px;
        }

        /* ഡ്രൈവർ കാർഡ് */
        .driver-card { 
            background: #ffde59; 
            border-radius: 25px; 
            border: 3px solid #000; 
            padding: 18px; 
            margin: 0 15px 15px 15px; 
            box-shadow: 6px 6px 0 #000; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }

        .driver-info p:first-child {
            font-style: italic;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .driver-info p:last-child {
            font-style: italic;
            font-weight: 500;
            color: #333;
            letter-spacing: 1px;
        }

        /* ബോട്ടം മെനു */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            max-width: 420px; 
            margin: 0 auto; 
            background: #111; 
            border-radius: 35px 35px 0 0; 
            padding: 15px; 
            display: flex; 
            justify-content: space-around; 
            border-top: 3px solid #000;
            z-index: 50; 
        }

        .nav-item { text-align: center; text-decoration: none; transition: 0.3s; }
        .nav-item i { font-size: 1.6rem; margin-bottom: 4px; display: block; }
        
        .nav-home { color: #4dabff; }    /* Bright Blue */
        .nav-call { color: #2ecc71; }    /* Vibrant Green */
        .nav-emergency { color: #ff4757; } /* Neon Red */

        #emergencyModal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 100; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="text-center pt-6">
        <div class="title-box">
            <h1 class="text-3xl font-black italic uppercase leading-tight">
                പാലത്തറ ഗേറ്റ് <br> ഓട്ടോ ടാക്സി സ്റ്റാൻഡ്
            </h1>
        </div>
        <div class="mt-2">
            <span class="trusted-partner text-lg">Your Trusted Ride Partner</span>
        </div>
    </div>

    <div class="px-6 mt-8 mb-4 flex items-center">
        <div class="h-[2px] bg-black flex-grow"></div>
        <p class="mx-3 text-xs font-black uppercase italic">ലഭ്യമായ ഡ്രൈവർമാർ 👇</p>
        <div class="h-[2px] bg-black flex-grow"></div>
    </div>

    <div id="driversList">
        </div>

    <div id="emergencyModal" onclick="closeEmergency()">
        <div class="bg-[#ffde59] p-8 rounded-[40px] w-full max-w-xs space-y-5 border-4 border-black shadow-[15px_15px_0_#ff4757]" onclick="event.stopPropagation()">
            <h2 class="text-3xl font-black text-center italic border-b-4 border-black pb-3">അടിയന്തര സഹായം</h2>
            <button onclick="window.location.href='tel:108'" class="w-full flex items-center justify-between bg-white p-5 rounded-2xl border-3 border-black font-black text-lg">
                <span>AMBULANCE</span><i class="fas fa-ambulance text-red-600 text-3xl"></i>
            </button>
            <button onclick="window.location.href='tel:100'" class="w-full flex items-center justify-between bg-white p-5 rounded-2xl border-3 border-black font-black text-lg">
                <span>POLICE</span><i class="fas fa-shield-alt text-blue-600 text-3xl"></i>
            </button>
            <button onclick="window.location.href='tel:101'" class="w-full flex items-center justify-between bg-white p-5 rounded-2xl border-3 border-black font-black text-lg">
                <span>FIRE FORCE</span><i class="fas fa-fire text-orange-600 text-3xl"></i>
            </button>
            <p class="text-center font-bold text-black animate-bounce mt-4">Close ✖</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item nav-home" onclick="window.location.reload()">
            <i class="fas fa-house-chimney"></i>
            <p class="text-[11px] font-black italic">ഹോം</p>
        </div>
        <div class="nav-item nav-call" onclick="window.location.href='tel:8129377047'">
            <i class="fas fa-phone-volume animate-pulse"></i>
            <p class="text-[11px] font-black italic">വിളിക്കുക</p>
        </div>
        <div class="nav-item nav-emergency" onclick="openEmergency()">
            <i class="fas fa-biohazard"></i>
            <p class="text-[11px] font-black italic">അപകടം</p>
        </div>
    </div>
</div>

<script>
    const drivers = [
        {name: "ഹനീഫ (Casper)", phone: "8129377047"},
        {name: "ഉമ്മർ", phone: "9544257381"},
        {name: "സുൽഫികർ", phone: "9895783735"},
        {name: "അബ്ബാസ്", phone: "9744106864"},
        {name: "വിജീഷ് (കാർത്തിക)", phone: "9946303174"},
        {name: "റസാഖ്", phone: "9995113455"},
        {name: "പ്രസാദ് (കരിന്തണ്ടൻ)", phone: "9961929035"},
        {name: "മുത്തു (സഹൽ)", phone: "9846883806"},
        {name: "കുഞ്ഞിപ്പ", phone: "9995337587"},
        {name: "സിദ്ദിഖ്", phone: "9745967372"},
        {name: "അബുടിക്ക", phone: "9745413184"},
        {name: "രാജൻ (സീസൺ)", phone: "9539932008"},
        {name: "അബ്ദുള്ള (ഹുബ്ബ്റസൂൽ)", phone: "8606409218"},
        {name: "സുഭാഷ്", phone: "9846482524"},
        {name: "വില്ലക്ക", phone: "7034082342"}
    ];

    const listDiv = document.getElementById('driversList');
    drivers.forEach(d => {
        listDiv.innerHTML += `
            <div class="driver-card">
                <div class="flex items-center space-x-4">
                    <div class="text-3xl"><i class="fas fa-taxi"></i></div>
                    <div class="driver-info">
                        <p>${d.name}</p>
                        <p>${d.phone}</p>
                    </div>
                </div>
                <div class="flex space-x-3">
                    <button onclick="saveVCard('${d.name}', '${d.phone}')" class="bg-black text-[#ffde59] p-3 rounded-full border-2 border-black">
                        <i class="fas fa-user-plus text-lg"></i>
                    </button>
                    <a href="tel:${d.phone}" class="bg-green-600 text-white p-3 rounded-full border-2 border-black shadow-[3px_3px_0_#000]">
                        <i class="fas fa-phone-alt text-lg"></i>
                    </a>
                </div>
            </div>
        `;
    });

    function saveVCard(name, phone) {
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEND:VCARD`;
        const blob = new Blob([vcard], { type: "text/vcard" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${name}.vcf`; a.click();
    }

    function openEmergency() { document.getElementById('emergencyModal').style.display = 'flex'; }
    function closeEmergency() { document.getElementById('emergencyModal').style.display = 'none'; }
</script>

</body>
</html>
