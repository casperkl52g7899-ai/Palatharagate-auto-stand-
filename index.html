<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palathara Gate Auto Stand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #ffde59; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .app-container { max-width: 420px; margin: 0 auto; background: #ffde59; min-height: 100vh; padding-bottom: 100px; }
        .round-box { background: white; border-radius: 15px; border: 2px solid #000; padding: 12px; box-shadow: 4px 4px 0 #000; }
        .fare-box { background: #000; color: #ffde59; padding: 15px; border-radius: 15px; text-align: center; font-size: 24px; font-weight: 900; margin: 15px 0; border: 2px solid #000; }
        .btn-pay { background-color: #4285F4; color: white; width: 100%; padding: 12px; border-radius: 50px; font-weight: bold; border: 2px solid #000; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="p-6 text-center">
        <h1 class="text-3xl font-black italic uppercase italic">പാലത്തറ ഗേറ്റ് <br> ഓട്ടോ സ്റ്റാൻഡ്</h1>
        <p class="text-[10px] font-bold tracking-widest uppercase mt-1">CASPER KL 52 G 7899</p>
    </div>

    <div class="px-6 space-y-4">
        <div class="round-box flex items-center space-x-3">
            <i class="fas fa-user text-gray-500"></i>
            <input type="text" id="custName" placeholder="നിങ്ങളുടെ പേര്" class="w-full outline-none">
        </div>

        <div class="round-box space-y-3">
            <div class="flex items-center space-x-3 border-bottom pb-2">
                <i class="fas fa-map-marker-alt text-green-500"></i>
                <input type="text" id="fromLoc" placeholder="നിന്ന് (From)" class="w-full outline-none">
                <button onclick="getLocation()" class="bg-blue-500 text-white p-2 rounded-lg text-xs">📍 എടുക്കുക</button>
            </div>
            <div class="flex items-center space-x-3 pt-2 border-t">
                <i class="fas fa-flag-checkered text-red-500"></i>
                <input type="text" id="toLoc" placeholder="എങ്ങോട്ട് (To)" class="w-full outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="round-box">
                <p class="text-[10px] font-bold mb-1">ദൂരം (KM)</p>
                <input type="number" id="kmInput" step="0.1" oninput="calculateFare()" placeholder="KM" class="w-full outline-none font-bold">
            </div>
            <div class="round-box">
                <p class="text-[10px] font-bold mb-1">സമയം</p>
                <input type="time" id="pickupTime" class="w-full outline-none">
            </div>
        </div>

        <button onclick="checkDistance()" class="text-xs font-bold text-blue-700 underline w-full text-center">ദൂരം ഗൂഗിൾ മാപ്പിൽ നോക്കാൻ ഇവിടെ അമർത്തുക</button>

        <div id="fareDisplay" class="fare-box">ചാർജ്: ₹0</div>

        <button id="payBtn" onclick="payDirect()" class="btn-pay shadow-[4px_4px_0_#000]">
            <i class="fab fa-google-pay text-2xl"></i> പണമടയ്ക്കുക
        </button>

        <button onclick="sendWhatsApp()" class="w-full bg-green-500 text-white py-4 rounded-full font-black text-lg border-2 border-black shadow-[4px_4px_0_#000] active:scale-95 transition-all">
            വാട്സാപ്പിൽ ബുക്ക് ചെയ്യാം
        </button>
    </div>
</div>

<script>
    let googleLink = "ലഭ്യമല്ല";

    function getLocation() {
        if (navigator.geolocation) {
            document.getElementById('fromLoc').value = "തിരയുന്നു...";
            navigator.geolocation.getCurrentPosition((pos) => {
                googleLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('fromLoc').value = "നിലവിലെ ലൊക്കേഷൻ ✅";
            }, () => {
                alert("ലൊക്കേഷൻ എടുക്കാൻ സാധിച്ചില്ല.");
                document.getElementById('fromLoc').value = "";
            });
        }
    }

    function checkDistance() {
        let from = document.getElementById('fromLoc').value;
        let to = document.getElementById('toLoc').value;
        if (!to) { alert("എങ്ങോട്ടാണ് പോകേണ്ടതെന്ന് നൽകുക"); return; }
        window.open(`https://www.google.com/maps/dir/${from}/${to}`, "_blank");
    }

    function calculateFare() {
        let km = parseFloat(document.getElementById('kmInput').value);
        let fare = 0;
        if (km > 0) {
            fare = km <= 1.5 ? 30 : km * 25;
            let total = Math.ceil(fare / 5) * 5;
            document.getElementById('fareDisplay').innerText = "ചാർജ്: ₹" + total;
            document.getElementById('payBtn').style.display = "block";
        } else {
            document.getElementById('fareDisplay').innerText = "ചാർജ്: ₹0";
            document.getElementById('payBtn').style.display = "none";
        }
    }

    function payDirect() {
        let fareTxt = document.getElementById('fareDisplay').innerText.replace("ചാർജ്: ₹", "");
        window.location.href = `upi://pay?pa=8129377047@ybl&pn=CASPER_AUTO&am=${fareTxt}&cu=INR`;
    }

    function sendWhatsApp() {
        let name = document.getElementById('custName').value;
        let from = document.getElementById('fromLoc').value;
        let to = document.getElementById('toLoc').value;
        let km = document.getElementById('kmInput').value;
        let fare = document.getElementById('fareDisplay').innerText;
        let time = document.getElementById('pickupTime').value;

        if(!name || !to || !time || !km) { alert("വിവരങ്ങൾ പൂർണ്ണമല്ല!"); return; }

        let msg = `*പുതിയ ഓട്ടോ ബുക്കിംഗ് (പാലത്തറ ഗേറ്റ്)*%0A%0A` +
                  `*പേര്:* ${name}%0A` +
                  `*നിന്ന്:* ${from}%0A` +
                  `*എങ്ങോട്ട്:* ${to}%0A` +
                  `*ദൂരം:* ${km} KM%0A` +
                  `*${fare}*%0A` +
                  `*സമയം:* ${time}%0A` +
                  `*ലൊക്കേഷൻ ലിങ്ക്:* ${googleLink}`;
        
        window.open(`https://wa.me/918129377047?text=${msg}`);
    }
</script>

</body>
</html>
